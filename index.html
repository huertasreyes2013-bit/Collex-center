:root{--bg:#0f1115;--card:#181b22;--tx:#f2f3f5;--mu:#9aa0ac;--ac:#ffcb05;--bd:#262a33}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}

.bar{position:sticky;top:0;background:var(--bg);padding:10px 12px;border-bottom:1px solid var(--bd);z-index:5}

.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.chip{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.it{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:3/4;background:linear-gradient(135deg,#222733,#161a22);display:flex;align-items:center;justify-content:center;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .no{color:#4a5160;font-size:12px;text-align:center;padding:8px}
.bd{position:absolute;top:6px;left:6px;background:var(--ac);color:#111;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.x{position:absolute;top:6px;right:6px;background:#000a;color:#fff;font-size:11px;padding:2px 7px;border-radius:6px}
.tx{padding:9px 10px 11px}
.nm{font-weight:600;font-size:13.5px;line-height:1.25}
.st{color:var(--mu);font-size:12px;margin-top:2px}
.pr{margin-top:6px;font-size:17px;font-weight:700;color:var(--ac)}
.pr small{font-size:11px;color:var(--mu);font-weight:400}
footer{padding:18px 16px 40px;text-align:center;color:var(--mu);font-size:12px}
.empty{padding:40px;text-align:center;color:var(--mu)}
</style></head><body>
